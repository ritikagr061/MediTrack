input {
  beats {
    port => 5044
  }
}

filter {
  mutate {
    add_field => {
      "system.name" => "meditrack"
      "environment.name" => "local"
    }
  }

  if ![service][name] and [container][name] {
    mutate {
      add_field => {
        "[service][name]" => "%{[container][name]}"
      }
    }
  }

  if [service.name] and ![service][name] {
    mutate {
      add_field => {
        "[service][name]" => "%{[service.name]}"
      }
    }
  }

  if [trace.id] and ![trace][id] {
    mutate {
      add_field => {
        "[trace][id]" => "%{[trace.id]}"
      }
    }
  }

  mutate {
    remove_field => [
      "@version",
      "agent",
      "authorization",
      "Authorization",
      "container",
      "ecs",
      "event",
      "host",
      "input",
      "jwt",
      "JWT",
      "log",
      "password",
      "Password",
      "service",
      "secret",
      "Secret",
      "stream",
      "tags",
      "token",
      "Token",
      "trace",
      "traceId"
    ]
  }

  mutate {
    gsub => [
      "message", "(?i)(password|jwt|token|authorization|secret)(\\s*[=:]\\s*)[^,\\s}\\\"]+", "\\1\\2[REDACTED]",
      "stack_trace", "(?i)(password|jwt|token|authorization|secret)(\\s*[=:]\\s*)[^,\\s}\\\"]+", "\\1\\2[REDACTED]",
      "error.message", "(?i)(password|jwt|token|authorization|secret)(\\s*[=:]\\s*)[^,\\s}\\\"]+", "\\1\\2[REDACTED]",
      "message", "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "[EMAIL_REDACTED]",
      "stack_trace", "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "[EMAIL_REDACTED]",
      "error.message", "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "[EMAIL_REDACTED]"
    ]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "meditrack-logs-%{+YYYY.MM.dd}"
  }
}
