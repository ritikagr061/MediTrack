server:
  port: 8080

#logging:
#  level:
#    org.springframework.cloud.gateway: DEBUG

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: ${JWT_SECRET}

  cloud:
    gateway:
      routes:
        - id: patient-service-route
          uri: http://patient-service:8080
          predicates:
            - Path=/api/patients,/api/patients/**,/api/hospitals,/api/hospitals/**,/api/medical-professionals,/api/medical-professionals/**,/api/encounters,/api/encounters/**
          filters:
            - StripPrefix=1
          ## filters are used to modify the request before forwarding it to the destination service.
          ## Here, strip-prefix=1 removes the first segment of the path (i.e., "api") before forwarding the request to the patient-service.
        - id: appointment-service-route
          uri: http://appointment-service:8080
          predicates:
            - Path=/api/appointments,/api/appointments/**
          filters:
            - StripPrefix=1
          ## StripPrefix=1 removes "api" so /api/appointments is forwarded as /appointments.
        - id: notification-service-route
          uri: http://notification-service:8080
          predicates:
            - Path=/api/notifications,/api/notifications/**
          filters:
            - StripPrefix=1
          ## StripPrefix=1 removes "api" so /api/notifications is forwarded as /notifications.
        - id: billing-service-route
          uri: http://billing-service:8080
          predicates:
            - Path=/api/billing,/api/billing/**
          filters:
            - StripPrefix=1
          ## StripPrefix=1 removes "api" so /api/billing is forwarded as /billing.
        - id: auth-service-route
          uri: http://auth-service:8080
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
      #########################################################
      #  GLOBAL CORS CONFIGURATION
      #########################################################
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':                                 # Apply these rules to all paths (/**)
            allowedOriginPatterns:                 # Frontend origins that can call this API
              - "http://localhost"
              - "http://localhost:*"
              - "http://127.0.0.1"
              - "http://127.0.0.1:*"
              - "https://*.meditrack.com"
            allowedMethods:                        # HTTP methods allowed from frontend
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: ["*"]                  # Allow any request header from frontend (e.g., Authorization, Content-Type)
            exposedHeaders:                        # Headers that JS in frontend is allowed to read from the response, note what you see in inspect != what JS can access
              - "Authorization"                    # e.g., if you send back a refreshed token
              - "Location"
              - "X-Correlation-Id"                 # e.g., for request tracing/logging in UI
              - "X-Trace-Id"                       # Trace ID generated by the gateway and reused by backend service logs
            allowCredentials: true                 # Allow sending cookies or Authorization headers in CORS requests
            maxAge: 3600                           # Cache preflight (OPTIONS) response for 1 hour in the browser
      default-filters:
        - name: RequestRateLimiter
          args:
            key-resolver: "#{@rateLimitKeyResolver}"
            redis-rate-limiter.replenishRate: ${RATE_LIMIT_REPLENISH_RATE:10}
            redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST_CAPACITY:20}
            redis-rate-limiter.requestedTokens: ${RATE_LIMIT_REQUESTED_TOKENS:1}
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin RETAIN_UNIQUE
        # Removes duplicate 'Access-Control-Allow-*' headers that can appear
        # when multiple filters or layers add the same header.
